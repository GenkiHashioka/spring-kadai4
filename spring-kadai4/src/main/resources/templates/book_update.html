<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>書籍情報の更新</title>
</head>
<body>
  <h1>書籍更新</h1>
  <!-- step5 更新機能の追加 -->
  <form th:action="@{/update}" method="post">
    <table>
      <tr>
        <td>書籍コード</td>
        <td>
          <!-- 読み取り専用 -->
          <input type="text" name="code" th:value="${book.code}" readonly>
        </td>
      </tr>
      <tr>
        <td>値段</td>
        <td>
          <input type="text" name="price" th:value="${book.price}">
        </td>
      </tr>
    </table>
    <br>
    <button>更新</button>
  </form>
</body>
</html>
